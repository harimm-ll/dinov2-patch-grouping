[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dinov2-patch-grouping"
version = "0.1.0"
description = "DINOv2 same-position patch similarity and adaptive graph grouping"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "torch>=2.1",
]

[project.scripts]
patch-grouping = "patch_grouping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

